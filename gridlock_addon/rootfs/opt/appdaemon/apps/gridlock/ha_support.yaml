# =====================================================================
# GridLock — HA-side support (the ONLY config that must live in HA).
# Installed automatically by the add-on on every start as
# <HA config>/packages/gridlock.yaml (needs `homeassistant: packages:
# !include_dir_named packages` in configuration.yaml -- the add-on
# can't add that for you).
#
# Why this can't be in the AppDaemon package:
# - input_booleans must be real HA helpers to be toggleable in the UI
# - the watchdog exists to survive AppDaemon itself dying, so it must
#   run in HA, not AppDaemon
# =====================================================================

input_boolean:
  gridlock_enable:
    name: GridLock Engine Master Switch
    icon: mdi:shield-flash
    initial: on
  gridlock_storm_watch:
    name: GridLock Storm Watch (manual)
    icon: mdi:weather-lightning-rainy

template:
  # Bridges Home Assistant's Label registry into a normal entity state —
  # AppDaemon (what GridLock actually runs under) has no registry access
  # at all (labels/areas/devices; see AppDaemon issue #505, still open),
  # but HA's own Jinja engine can read labels via label_entities(), so
  # this lets HA do the lookup and GridLock just read the result like any
  # other sensor. Tag any device_class:power entity you want GridLock to
  # pick up with a label named "GridLock Power" — Settings > Areas,
  # labels & zones > Labels. Must go on the entity itself, not its
  # device: HA doesn't roll device/area labels up to entities, so
  # label_entities() below won't see a device-level one. Renaming what a
  # circuit represents needs no GridLock-side feature at all: it's just
  # that entity's own friendly name, already editable from Settings >
  # Devices & services > Entities.
  #
  # Looked up via label_id("GridLock Power") rather than a hardcoded
  # "gridlock_power" string — confirmed against a real install that a
  # label's actual internal ID doesn't necessarily match the obvious
  # slug of its display name, so a guessed ID silently matches nothing.
  # label_id() resolves whatever ID Home Assistant actually assigned to
  # a label with this exact display name, which is also HA's own
  # documented way to compose these two functions together.
  #
  # Deliberately trigger-based on a time_pattern rather than a plain
  # reactive template: confirmed via Home Assistant's own open issues
  # (#115439, #118765) that a template using label_entities() does NOT
  # reliably re-evaluate when a label is added to or removed from an
  # entity — that's a registry change, not a state_changed event, and
  # nothing currently notifies template sensors of it. Polling every 5
  # minutes (matching GridLock's own tick cadence — no benefit to
  # fresher than that here) works around it instead of assuming the
  # documented "automatically updates" behaviour actually holds.
  - trigger:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "GridLock Power Circuits"
        unique_id: gridlock_power_circuits
        icon: mdi:flash
        state: "{{ label_entities(label_id('GridLock Power') or 'gridlock_power') | length }}"
        attributes:
          entity_ids: "{{ label_entities(label_id('GridLock Power') or 'gridlock_power') }}"
          resolved_label_id: "{{ label_id('GridLock Power') }}"
  # The Shelly integration's own power sensors -- AppDaemon can't see
  # which integration an entity belongs to, and a relay also added through
  # Matter matched GridLock's Shelly naming convention twice over.
  - trigger:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "GridLock Shelly Power"
        unique_id: gridlock_shelly_power
        icon: mdi:flash
        state: "{{ integration_entities('shelly') | select('match', 'sensor\\..*_power$') | list | length }}"
        attributes:
          entity_ids: "{{ integration_entities('shelly') | select('match', 'sensor\\..*_power$') | list }}"

input_select:
  # GridWarm's master control switch (READ-ONLY / ACTIVE on the GridWarm
  # tab). A real helper so the dashboard's toggle can use the normal
  # input_select service; the engine creates a virtual stand-in if this
  # package hasn't been loaded yet. Resets to read_only on an HA
  # restart -- the safe default for anything that commands heating.
  gridlock_gridwarm_mode:
    name: GridLock GridWarm Control Mode
    icon: mdi:heat-pump
    options:
      - read_only
      - active
    # No "initial:" -- that would force READ-ONLY on every HA restart and
    # silently stop a house that was being heated. HA restores the last
    # state instead; a brand-new helper starts on the first option,
    # read_only, which is the safe first-run default.
  gridlock_mode_override:
    name: GridLock Mode Override
    icon: mdi:tune-vertical
    options:
      - auto
      - eco
      - balanced
      - max_profit
    initial: auto
    # "auto" defers to apps.yaml's battery_risk_profile; picking eco/
    # balanced/max_profit here (e.g. from the web UI's segmented
    # control, or this helper directly) overrides it live, no AppDaemon
    # restart needed. gridlock.py auto-creates this as a virtual entity
    # if it's missing, same as gridlock_enable above, but a real helper
    # here also makes it toggleable/visible from Settings > Helpers and
    # any dashboard, not just the add-on's own web UI.

automation:
  - alias: "GridLock fail-safe watchdog"
    description: >
      If the GridLock heartbeat goes stale (AppDaemon crashed or hung),
      revert the inverter to safe self-consumption defaults.
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: >
          {{ states('sensor.gridlock_heartbeat') in ['unknown', 'unavailable']
             or (now() - (states('sensor.gridlock_heartbeat')
                 | as_datetime(now()))).total_seconds() > 900 }}
      - condition: template
        value_template: >
          {{ states('select.sigen_plant_remote_ems_control_mode')
             != 'Maximum Self Consumption'
             or states('number.sigen_plant_ess_max_discharging_limit')
             | float(10) < 10 }}
    actions:
      - action: select.select_option
        target:
          entity_id: select.sigen_plant_remote_ems_control_mode
        data:
          option: "Maximum Self Consumption"
      - action: number.set_value
        target:
          entity_id: number.sigen_plant_ess_max_discharging_limit
        data:
          value: 10
      - action: number.set_value
        target:
          entity_id: number.sigen_plant_ess_max_charging_limit
        data:
          value: 10
      - action: persistent_notification.create
        data:
          title: "GridLock watchdog fired"
          message: >
            GridLock heartbeat is stale — inverter reverted to
            Maximum Self Consumption. Check the AppDaemon log.
