gridlock:
  module: gridlock
  class: GridLock

  # --- Hardware (Sigenergy) ---
  sigen_mode: select.sigen_plant_remote_ems_control_mode
  sigen_discharge_limit: number.sigen_plant_ess_max_discharging_limit
  sigen_charge_limit: number.sigen_plant_ess_max_charging_limit
  sigen_soc: sensor.sigen_inverter_battery_state_of_charge

  # --- Inputs ---
  # ev_charging: switch.hypervolt_xxxxx_charging  # only if auto-discovery
  #   guesses wrong or you don't use a Hypervolt charger — the engine
  #   looks for a "switch." entity with "hypervolt" + "charging" in its
  #   entity_id first, so this is usually not needed.

  # Octopus (BottlecapDave integration) entities are auto-discovered
  # at startup by naming pattern, since your account/MPAN is baked
  # into the entity_id itself — nothing to configure here for a single
  # Octopus account/electricity meter. Check the AppDaemon log for
  # "Multiple entities match" warnings if you have more than one
  # account/meter and discovery picks the wrong one; only then set the
  # affected key explicitly below as a literal value (NOT !secret —
  # AppDaemon's app-config loader has no built-in secrets.yaml/!secret
  # support the way HA core does; using it here breaks the whole file):
  # octopus_dispatch: binary_sensor.octopus_energy_a_XXXXXXXX_intelligent_dispatching
  # import_rate: sensor.octopus_energy_electricity_XXXXXXXX_1111111111111_current_rate
  # export_rate: sensor.octopus_energy_electricity_XXXXXXXX_2222222222222_export_current_rate
  # octopus_saving_events: event.octopus_energy_a_XXXXXXXX_octoplus_saving_session_events
  # import_rates_previous / import_rates_today / import_rates_tomorrow
  # export_rates_today / export_rates_tomorrow
  # daily_import_cost_entity / daily_standing_charge_entity /
  # daily_export_value_entity — check the Discovered Entities panel
  # first; if it's wrong/missing, set it here or via the add-on's
  # Configuration tab (daily_export_value_entity_override). Either way
  # GridLock also tracks its own running import/export total from live
  # grid power + rates as a fallback, so "Today net" never silently
  # ignores export credit even with nothing configured — see the
  # tooltip on that tile for the calculated figure.
  # daily_export_value_entity: sensor.octopus_energy_electricity_XXXXXXXX_2222222222222_current_accumulative_cost

  # --- Octoplus Power Down / Power Up (Saving Sessions / Free
  # Electricity Sessions, renamed) ---
  # Power Down (reduce consumption below a predicted baseline for
  # octopoints) is auto-discovered and auto-joined as before. Power Up
  # (consume MORE than baseline, credited in £ at your own unit rate —
  # a genuinely separate programme, not the same thing renamed) is new:
  # auto-discovered, but there's no join step — you're automatically
  # included in every announced session once enrolled with Octopus.
  # Both programmes' *baseline* sensors (a real predicted per-half-hour
  # curve, not a guess — computed by the integration from your own
  # historic consumption) are **disabled by default in Home Assistant**
  # — enable them yourself (Settings > Devices & services > Entities)
  # for GridLock to actually weigh the reward/credit into the plan.
  # Without them, sessions still show up in the plan table as
  # informational markers, just without the economic incentive applied.
  # power_up_events: event.octopus_energy_a_XXXXXXXX_octoplus_power_up_events
  # power_down_baseline_entity: sensor.octopus_energy_electricity_XXXXXXXX_1111111111111_octoplus_power_down_baseline
  # power_up_baseline_entity: sensor.octopus_energy_electricity_XXXXXXXX_1111111111111_octoplus_power_up_baseline
  # octopoint_value_gbp: 0.00125    # £ per octopoint (1/800) — community-consensus rate, override if Octopus changes it

  # Power Down also has its own SEPARATE export-side baseline sensor
  # (confirmed real via a user's own HA entity data) — a genuine
  # predicted per-half-hour EXPORT curve alongside the import baseline
  # above, for the same joined session. GridLock models exporting MORE
  # than this as earning the same session's octopoints, on top of any
  # import-side reduction credit. Auto-discovered off the export meter's
  # own serial/MPAN; also disabled by default in HA, same as the import
  # baseline above. (Power Up's export-side baseline is discovered too,
  # but deliberately not weighed into the plan yet — whether/how it
  # affects Power Up's reward isn't confirmed, so it's exposed for
  # visibility only, not used as an economic incentive.)
  # power_down_export_baseline_entity: sensor.octopus_energy_electricity_XXXXXXXX_2222222222222_export_octoplus_power_down_baseline
  # power_up_export_baseline_entity: sensor.octopus_energy_electricity_XXXXXXXX_2222222222222_export_octoplus_power_up_baseline

  # Solcast half-hourly curves
  solcast_detail_today: sensor.solcast_pv_forecast_forecast_today
  solcast_detail_tomorrow: sensor.solcast_pv_forecast_forecast_tomorrow

  # House load: auto-discovered (a "sensor." entity containing "sigen"
  # + "load"/"consumption") and learned into a per-half-hour-of-day
  # profile over time — see load_hourly_weights below for the fallback
  # used before enough data's been learned. Override only if discovery
  # picks the wrong sensor or your inverter integration isn't Sigen:
  # load_power_entity: sensor.sigen_plant_load_power

  # Power circuits (e.g. Shelly relays monitoring individual appliances):
  # no config key here at all — tag any device_class:power entity with a
  # label named "GridLock Power" (id: gridlock_power) in Home Assistant
  # (Settings > Areas, labels & zones > Labels) and GridLock picks it up
  # automatically within 5 minutes, no apps.yaml editing or restart
  # needed. Renaming what a circuit represents is just that entity's own
  # name (Settings > Devices & services > Entities) — nothing to rename
  # on GridLock's side. Each tagged circuit is shown live on the
  # dashboard's Forecast tab AND subtracted from the whole-house load
  # sample before it's learned, then forecast separately in its own
  # right — so a labelled circuit's own pattern (e.g. a dryer that only
  # runs some days) doesn't get smeared into the general baseline. Why a
  # label and not a list here: AppDaemon (what GridLock runs under) has
  # no way to query HA's own registries at all — the label lookup
  # actually happens HA-side, via ha_support.yaml's template sensor.

  # --- Model parameters ---
  battery_capacity_kwh: 36.0
  typical_daily_house_kwh: 12.0
  inverter_efficiency: 0.90
  # Three real operational modes for the LP optimiser (core/optimizer.py),
  # not just a degradation-cost scalar under one shared behaviour. Each
  # mode has TWO separate £/kWh cost thresholds — one for using the
  # battery for your own load (self-consumption), one specifically for
  # selling it to the grid (export) — since "worth it to save on your
  # own bill" and "worth it to sell" are genuinely different bars:
  #   eco         — normal self-consumption threshold (0.09 default),
  #                 but a deliberately very high export threshold
  #                 (0.25 default) — the battery *can* still export on
  #                 a genuinely exceptional day, but at typical Agile/
  #                 IOG spreads that bar sits above nearly everything,
  #                 so in practice it stays close to "never" without
  #                 hard-blocking a real outlier.
  #   balanced     — exports allowed wherever export_rate - import_rate/
  #                 efficiency clears the degradation cost below
  #                 (0.15 default, same number for both self-consumption
  #                 and export); the default mode.
  #   max_profit    — near-zero self-consumption cost (no hesitation to
  #                 use the battery for your own load) but a small real
  #                 export floor (0.03 default) rather than selling at
  #                 literally any positive margin — preserving only
  #                 enough SoC for forecasted load until the next
  #                 off-peak slot.
  # Check the Forecast tab's Battery health panel for the SoH sensors
  # that motivated the degradation-cost lever, and the current effective
  # £/kWh thresholds under whichever mode you pick. Not a real
  # degradation-vs-cycling model (no solid data to build one from), just
  # a sensible lever to have.
  battery_risk_profile: balanced      # eco | balanced | max_profit
  # battery_degradation_cost: 0.03    # £/kWh (self-consumption) — overrides the mode's default above if set
  # export_degradation_cost: 0.20     # £/kWh (export specifically) — overrides the mode's export default if set
  # Optional (balanced mode only): once today's cumulative real grid
  # cost drops to/below this £ figure, stop exporting for the rest of
  # today (tomorrow gets its own fresh budget). Unset by default — the
  # LP just keeps selling wherever it's profitable all day.
  # target_daily_net_cost: 0.0
  # Extra slack the on-peak reserve holds back on top of the bare
  # forecasted load for the rest of a peak stretch — 0.15 means "reserve
  # for 115% of predicted load", not exactly 100% of it. Matters because
  # the plan re-solves every 5 minutes and can't claw back charge an
  # earlier slot already exported/discharged: if the learned load
  # forecast for a later slot drifts upward after an earlier one has
  # already sold against the old, lower estimate, that's gone — only a
  # margin held back in advance protects against it. Raise this if
  # you're seeing Bypass slots you don't think should've happened; lower
  # it (toward 0) to squeeze closer to the theoretical maximum if your
  # load is very predictable and you'd rather have the extra export.
  reserve_margin_pct: 0.15
  # Reserve the plan won't discharge below, even if profitable. Default
  # 0 uses the full battery; raise this if you'd rather keep a buffer
  # against deep-discharge wear — most general battery guidance
  # suggests some margin, but that's a preference, not enforced here.
  floor_soc: 0
  charge_rate_kw: 10.0
  discharge_rate_kw: 10.0
  ev_concurrent_charge_kw: 5.0        # battery charge rate while Hypervolt active
  default_import_rate: 0.2839
  default_export_rate: 0.15
  export_margin: 0.02
  # Import rate at/below which a slot counts as "off-peak" for pacing
  # self-consumption toward the next cheap window, and as the hard
  # floor for grid-charging (charging above this, arbitrage math
  # aside, never happens except Storm Watch).
  cheap_rate_threshold: 0.10
  # Smallest export worth bothering with, as % of battery capacity —
  # a lone slot selling a fraction of a percent isn't worth the SoC
  # it spends even if it technically shaves a fraction of a penny off
  # cost. Blocks aren't split up to satisfy this — only a whole
  # contiguous export block below the threshold gets dropped back to
  # self-consumption; a genuinely good export window is untouched.
  min_export_pct: 5.0
  # Superseded as of the LP optimiser (v3.0.0): the LP always paces
  # battery use optimally across the whole horizon on its own — there's
  # no longer an "immediate spend vs ration" choice to make by hand, the
  # solver finds whichever is actually cheapest. Left parseable (logged,
  # not an error) so an existing apps.yaml with this set doesn't break;
  # it just no longer changes behaviour.
  # conserve_battery_for_peak: false
  # Max rate EXPORT is allowed to sell at, per slot - separate from
  # discharge_rate_kw (self-consumption still uses the full hardware
  # rate for real load). Defaults to discharge_rate_kw (no change).
  # Lowering it spreads the same volume across more slots for a
  # gentler peak discharge current - but it's a real financial
  # tradeoff, not a free win: the good export window is only ever so
  # many slots long, and once it runs out of slots to spread into,
  # less total volume gets sold at a good rate. Tested at half rate on
  # a real evening window: ~24% less profit, not "the same money".
  # export_rate_kw: 10.0
  # Optional: 24 hourly load weights (relative), used only for slots
  # the learned load profile above doesn't have data for yet:
  # load_hourly_weights: [2,2,2,2,2,2,4,6,5,4,4,4,4,4,4,5,7,9,9,8,6,5,4,3]

  # --- Tariff comparison ---
  # Intelligent Octopus Go (IOG) is listed here too even though it's
  # the tariff this whole app is built around — this comparison uses
  # today's actual usage against each tariff's own static rate
  # structure, so IOG needs its own entry like any other option rather
  # than being silently assumed. Only the guaranteed overnight window
  # (23:30-05:30) is representable here — IOG's other lever, up to 6h/
  # day of variable smart-dispatch bonus slots, is decided by Octopus
  # day to day and has no fixed clock-time window to encode in a static
  # comparison, so this understates how cheap a real IOG day can get
  # whenever extra dispatch hours are actually granted.
  compare_tariffs:
    - name: "Intelligent Octopus Go"
      import_default: 0.274
      import: [{ start: "23:30", end: "05:30", rate: 0.035 }]
      export: 0.15
    - name: "Octopus Go"
      import_default: 0.2662
      import: [{ start: "00:30", end: "05:30", rate: 0.085 }]
      export: 0.15
    - name: "Flexible (SVT)"
      import_default: 0.2703
      export: 0.15
    - name: "Cosy Octopus"
      import_default: 0.2634
      import:
        - { start: "04:00", end: "07:00", rate: 0.1289 }
        - { start: "13:00", end: "16:00", rate: 0.1289 }
        - { start: "16:00", end: "19:00", rate: 0.3595 }
        - { start: "22:00", end: "00:00", rate: 0.1289 }
      export: 0.15
    - name: "E7"
      import_default: 0.2950
      import: [{ start: "00:30", end: "07:30", rate: 0.13 }]
      export: 0.04
    # EDF GoElectric and E.ON Next Drive rates below checked against
    # each supplier's own published figures (2026) — both suppliers'
    # actual rates vary by region/meter type/fixed-vs-smart variant, so
    # treat these as illustrative starting points and check your own
    # postcode's real published rate rather than assuming these match
    # exactly, same caveat as every other entry in this list.
    - name: "EDF GoElectric"
      import_default: 0.2891
      import: [{ start: "23:00", end: "06:00", rate: 0.0699 }]
      export: 0.15
    - name: "E.ON Next Drive"
      import_default: 0.30625
      import: [{ start: "00:00", end: "06:00", rate: 0.08 }]
      export: 0.15

  # --- Storm Watch ---
  # Charge to target and hold (no exports) while a weather alert is active.
  # Works with MeteoAlarm (HA core integration, uses Met Office feed for UK):
  storm_watch_entity:
    - entity: binary_sensor.meteoalarm      # Met Office red warnings only
      severity: ["Extreme"]
  storm_watch_target_soc: 100

  # --- Main fuse load management ---
  # Defaults ON at 100A (standard UK single-phase domestic supply) —
  # override the figure if yours is different, or set to false to
  # disable entirely (e.g. a 3-phase property). GridLock has no control
  # over the EV charger, hot tub, or heat pump at all — the battery is
  # the only lever it has, so this reacts to the live combined
  # site-import reading (house + EV + battery + everything, net of PV)
  # rather than trying to model/predict what those other loads are
  # about to do. Deliberately never discharges the battery to "help" —
  # the whole point of the cheap overnight window this matters most for
  # is to charge it, so draining it back out would defeat the purpose.
  # Only ever smoothly throttles the battery's own charge rate down to
  # whatever headroom is actually left (full rate whenever there's
  # room, reduced — never negative — when there isn't).
  # main_fuse_amps: 100          # set false to disable; override the figure if not 100A
  # mains_voltage: 240           # UK standard; override if not on 240V
  # load_mgmt_warn_pct: 0.80     # start throttling the charge rate above this % of the fuse rating
  # load_mgmt_critical_pct: 0.90  # the real ceiling charging throttles toward — never charge past this

  # --- GridWarm: heat pump thermal model + anticipatory plan (Phase 1,
  #     advisory only) ---
  # For each zone, looks ahead at the outdoor temperature forecast and
  # eases the target down before a forecast warm-up (passive warming
  # will do some of the work, so less active heating is needed) or
  # nudges it up before a forecast cold snap (get ahead of it while
  # it's still easy/efficient) — instead of only reacting to the
  # current outdoor temperature the way a plain weather-compensation
  # curve does. Shown on the GridWarm tab alongside a comparison against
  # reacting with no lookahead at all, in both kWh and £. This adjusts
  # the target this model works from, not a literal flow temperature —
  # there's no separate flow-temp variable simulated here — but the
  # real effect is the same: heat less now if warmth is coming, a
  # little more now if cold is coming. Heat output stays "low and slow"
  # (heat_min_power, gentle and continuous) unless a zone is genuinely
  # far behind — see boost_threshold_degrees below — rather than
  # cycling to full power like a boiler. **Never writes to any
  # climate/heating entity** — this is a recommended schedule, not one
  # applied automatically. No auto-discovery here — a heat-pump
  # controller's exact entity names are specific to the installed
  # hardware, so list your own zones explicitly.
  #
  # active: false (or deleting the whole gridwarm: block) disables this
  # entirely without needing to delete your zone configs.
  #
  # gridwarm:
  #   active: true
  #   zones:
  #     # One heating zone for the whole house (a single loop/thermostat
  #     # setup, the common case) — use whichever room's sensor is most
  #     # representative as internal_temp_entity, heat_share: 1.0 since
  #     # it's the only zone, not a slice shared with others. If you
  #     # genuinely have separate independently-heated zones (their own
  #     # loops/valves, not just extra thermometers around one house),
  #     # repeat this block per zone instead, with heat_share split
  #     # between them.
  #     - name: "Bedroom 4"
  #       internal_temp_entity: climate.bedroom_4_qing_thermo
  #       target_temp_entity: climate.bedroom_4_qing_thermo
  #       target_temp_attribute: temperature   # a climate.* entity auto-reads current_temperature for internal_temp_entity; set internal_temp_attribute explicitly only for something that isn't climate.*
  #       external_temp_entity: sensor.openweathermap_temperature
  #       weather_entity: weather.openweathermap   # needed for the forecast lookahead -- without it, this zone just holds steady (no trend to anticipate)
  #       heating_entity: binary_sensor.loft_heatpump_controller_compressor_running
  #       cop_entity: sensor.loft_heatpump_controller_coefficient_of_performance  # optional
  #       heat_loss_degrees: 0.035   # °C lost per hour per °C of (inside - outside) diff — from timing a real cooldown with heating off
  #       heat_loss_watts: 170       # smaller fixed background loss, on top of the above
  #       heat_gain_static: 300      # passive gain from occupants/electronics/incidental solar, watts
  #       heat_max_power: 7000       # heat pump's total thermal output flat out, watts
  #       heat_min_power: 2000       # thermal output once modulating down near target, watts
  #       heat_share: 1.0            # the only zone -- gets the whole output, not a slice of it
  #       heating_cop: 4.15
  #       heat_volume: 123           # m3 — used to estimate thermal mass (air + furniture/fabric, an approximation)
  #       hysteresis: 0.5            # °C below target that (re)starts heating
  #       hysteresis_off: 0.1        # °C above target that stops heating
  #       anticipation_lookahead_hours: 3.0   # how far ahead to look for a trend (default shown)
  #       anticipation_sensitivity: 0.3       # °C of target adjustment per °C of anticipated swing (default shown)
  #       anticipation_max_adjust: 2.0        # caps the adjustment either way (default shown)
  #     - name: "Hot Water Tank"
  #       internal_temp_entity: sensor.loft_heatpump_controller_water_tank_temperature_t5
  #       target_temp_entity: number.loft_heatpump_controller_set_dhw_tank_temperature_t5s
  #       external_temp_constant: 18  # a tank loses heat to indoor ambient, not the outdoors -- no weather_entity means no anticipation for this zone (nothing to look ahead at), which is fine
  #       heating_entity: switch.loft_heatpump_controller_power_dhw_t5s
  #       cop_entity: sensor.loft_heatpump_controller_coefficient_of_performance
  #       heat_loss_degrees: 0        # negligible for a well-insulated cylinder — heat_loss_watts covers standing loss instead
  #       heat_loss_watts: 60         # typical unvented-cylinder standing loss — check your own cylinder's spec sheet if known
  #       heat_gain_static: 0
  #       heat_max_power: 3500        # heat pumps typically derate well below their space-heating max at DHW's higher flow temp
  #       heat_min_power: 1500
  #       heat_share: 1.0             # DHW gets the full (derated) output while actively running, not split with space heating
  #       heating_cop: 2.5            # usually notably lower than space-heating COP, due to the higher flow temp DHW needs
  #       tank_litres: 150            # exact physics from here — no fudge factor needed, unlike heat_volume above
  #       hysteresis: 2.0
  #       hysteresis_off: 0.5
  #       # Usable hot water estimate (dashboard only, doesn't affect the
  #       # model) — a tank at target_temp_entity's own setpoint isn't the
  #       # same as "full of usable hot water": mixing tank_litres down
  #       # with cold mains to a comfortable shower temperature yields
  #       # MORE than tank_litres if the tank's well above shower_temp_c,
  #       # and drops toward zero as the tank cools toward shower_temp_c.
  #       shower_temp_c: 40            # comfortable mixed shower temperature (default shown)
  #       cold_mains_temp_c: 10        # UK mains cold-water temperature, roughly (default shown)
  #       litres_per_shower: 40        # rough UK-average shower usage (default shown) — override with your own if known
  #       # Active control -- opt-in, this whole feature is off unless
  #       # control_entity is set. GridWarm will then actually write to
  #       # this switch each tick (on/off) based on its own plan, instead
  #       # of just predicting. Only use a dedicated force-heating
  #       # override that's CONFIRMED, by actually testing it in Developer
  #       # Tools > Actions and watching what happens (compressor running,
  #       # power draw, tank temperature), to genuinely command the heat
  #       # pump compressor -- not an entity that merely looks right by
  #       # name or by another project's own documentation. Confirmed the
  #       # hard way on the Midea-based "Heatpump Controller" ESPHome
  #       # integration this session was built against: its documented
  #       # switch.<device>_forced_water_tank_heating (used by that
  #       # project's own example automations for exactly this) actually
  #       # triggered the resistive backup heater on real hardware --
  #       # massive power draw, compressor never engaged -- despite the
  #       # register naming and upstream docs both suggesting otherwise.
  #       # Never use the tank's main DHW power/enable switch either, which
  #       # may gate unrelated internal functions. Test before enabling.
  #       # control_entity: switch.your_confirmed_dhw_force_heating_switch
  #       # control_safety_min_temp: 45   # hard floor -- heat regardless of plan below this, never negotiable
  #       # control_max_off_hours: 6      # never hold heating off continuously longer than this, in case it interacts with the heat pump's own internal cycles (e.g. anti-legionella) in ways not confirmed here
  #       # A real HA helper input_boolean.gridlock_gridwarm_control_<zone>
  #       # is auto-created as a pause switch -- flip it off any time to
  #       # instantly stop GridWarm touching this switch and hand control
  #       # back to the heat pump's own normal logic.

  # SSEN Power Track — polled directly by the engine, no HA sensors needed.
  # Postcode prefix (outward code + first digit of inward code, e.g.
  # "SW1A 1") — literal value (see note above re: !secret not working
  # here). Leave commented out to disable SSEN polling.
  # ssen_postcode: "SW1A 1"

  # --- Notifications ---
  # Storm Watch starting/clearing, a Saving Session being joined, and
  # EV Protection engaging always create a persistent_notification in
  # HA (Settings > Notifications) — no setup needed. Optionally also
  # send to a specific notify service (e.g. your phone):
  # notify_service: notify.mobile_app_yourphone
  #
  # The Saving Session notification also includes a best-effort plan
  # note — how much of the battery it currently expects to discharge
  # across that specific session's window (e.g. "Plan currently
  # expects to discharge ~40% of the battery during this window."),
  # solved fresh at join time. Best-effort: if that solve fails for any
  # reason the join itself still goes through, just without the note.
  #
  # Once daily (evening, from 18:00), GridLock also checks tomorrow's
  # plan for a genuine reserve shortfall — i.e. even with an optimal
  # charge/discharge schedule against the real solar forecast, does the
  # LP still fall short? If so it fires "GridLock: Possible solar
  # shortfall tomorrow", suggesting plugging in the EV to improve the
  # odds of extra smart-charging dispatch during the day. This reads
  # the solver's own reported shortfall, not a hand-rolled comparison
  # against a fixed daily load figure — deliberately, so it doesn't
  # false-positive on a battery that's routinely low overnight because
  # abundant solar is coming to refill it (the normal pattern on a good
  # day). Advisory only: GridLock can't request or influence when
  # Octopus actually grants dispatch, only flag that it's worth trying.

  # --- Battery health (Forecast tab) ---
  # Auto-discovered by default (Sigenergy "pcs"/"cell"/
  # "state_of_health" sensors) — only set these if the Discovered
  # Entities panel shows the wrong one, or you're not on Sigenergy
  # hardware:
  # inverter_temp_entity: sensor.sigen_inverter_pcs_internal_temperature
  # battery_temp_entity: sensor.sigen_plant_ess_average_cell_temperature
  # battery_soh_entity: sensor.sigen_plant_battery_state_of_health
  #
  # Not just informational: once inverter_temp_entity reads above 60°C,
  # every charge/discharge command GridLock sends gets scaled down
  # (linear taper to 25% by 75°C) — an extra safety margin on top of
  # whatever thermal protection the inverter has built in already
  # (unverified what that is). No setting to disable this currently.

  # Hardware-level backstop for floor_soc — auto-discovered
  # (number.sigen_plant_ess_discharge_cut_off_state_of_charge), kept in
  # sync with floor_soc automatically. Without this, floor_soc only
  # ever existed in GridLock's own planning, with no hardware-level
  # stop if the tick loop ever hung mid-command. Override if discovery
  # picks the wrong one:
  # discharge_cutoff_entity: number.sigen_plant_ess_discharge_cut_off_state_of_charge
