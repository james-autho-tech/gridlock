<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f1526"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- faint grid texture -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <path d="M0 40H1280M0 80H1280M0 120H1280M0 160H1280M0 200H1280M0 240H1280M0 280H1280"/>
    <path d="M80 0V320M160 0V320M240 0V320M1040 0V320M1120 0V320M1200 0V320"/>
  </g>

  <!-- right-side mini flow diagram, echoing the live power-flow card -->
  <g transform="translate(930,0)">
    <circle cx="150" cy="60"  r="46" fill="url(#glowAmber)"/>
    <circle cx="260" cy="160" r="46" fill="url(#glowCyan)"/>
    <circle cx="150" cy="260" r="46" fill="url(#glowGreen)"/>
    <circle cx="40"  cy="160" r="46" fill="url(#glowViolet)"/>

    <g stroke-width="3" fill="none" opacity="0.8">
      <line x1="150" y1="60"  x2="160" y2="160" stroke="#fbbf24"/>
      <line x1="260" y1="160" x2="160" y2="160" stroke="#38bdf8"/>
      <line x1="150" y1="260" x2="160" y2="160" stroke="#34d399"/>
      <line x1="40"  y1="160" x2="160" y2="160" stroke="#a78bfa"/>
    </g>
    <circle cx="160" cy="160" r="5" fill="#e2e8f0"/>

    <circle cx="150" cy="60"  r="21" fill="#0f1526" stroke="#fbbf24" stroke-width="2"/>
    <text x="150" y="68" font-size="20" text-anchor="middle">☀️</text>
    <circle cx="260" cy="160" r="21" fill="#0f1526" stroke="#38bdf8" stroke-width="2"/>
    <text x="260" y="168" font-size="20" text-anchor="middle">⚡</text>
    <circle cx="150" cy="260" r="21" fill="#0f1526" stroke="#34d399" stroke-width="2"/>
    <text x="150" y="268" font-size="20" text-anchor="middle">🔋</text>
    <circle cx="40" cy="160" r="21" fill="#0f1526" stroke="#a78bfa" stroke-width="2"/>
    <text x="40" y="168" font-size="20" text-anchor="middle">🏠</text>

    <circle cx="160" cy="160" r="3" fill="#38bdf8">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M150,60 L160,160" />
    </circle>
    <circle cx="160" cy="160" r="3" fill="#34d399">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M160,160 L150,260" />
    </circle>
  </g>

  <!-- left: mark + wordmark -->
  <g transform="translate(70,95)">
    <circle cx="45" cy="45" r="45" fill="url(#glowCyan)" filter="url(#soft)"/>
    <circle cx="45" cy="45" r="40" fill="#0f1526" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="45" y="60" font-size="42" text-anchor="middle">⚡</text>

    <text x="115" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="54"
          font-weight="800" letter-spacing="1" fill="#e2e8f0">GridLock</text>
    <text x="117" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="19"
          fill="#94a3b8" letter-spacing="0.5">Battery optimisation for Sigenergy + Octopus Intelligent Go</text>

    <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">
      <rect x="118" y="95" width="150" height="30" rx="15" fill="none" stroke="#34d399" stroke-width="1.5"/>
      <text x="193" y="115" fill="#34d399" text-anchor="middle">Cost-aware planning</text>

      <rect x="280" y="95" width="130" height="30" rx="15" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="345" y="115" fill="#fbbf24" text-anchor="middle">Solar-forecast smart</text>

      <rect x="422" y="95" width="140" height="30" rx="15" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="492" y="115" fill="#a78bfa" text-anchor="middle">Home Assistant add-on</text>
    </g>
  </g>
</svg>
