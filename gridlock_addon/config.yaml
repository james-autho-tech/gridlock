name: GridLock
version: "3.5.1"
slug: gridlock
description: Battery optimisation engine for Sigenergy + Octopus IOG (bundled AppDaemon)
url: https://github.com/james-autho-tech/gridlock
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
init: false
hassio_api: true
homeassistant_api: true
hassio_role: default
ingress: true
ingress_port: 8099
panel_icon: mdi:battery-charging-high
panel_title: GridLock
map:
  - addon_config:rw
  - ssl
  # Read/write access to HA core's own /config directory (mounted at
  # /homeassistant_config inside this container) — needed so the
  # add-on can write its own packages/gridlock.yaml (the fail-safe
  # watchdog automation + helpers) automatically on every start,
  # rather than requiring the user to copy it in by hand and restart
  # HA core themselves. See the "run" script's sync_ha_support step.
  - homeassistant_config:rw
# Optional entity overrides for when auto-discovery picks the wrong
# thing (check the web UI's "Discovered entities" panel first — these
# only need setting if something there is wrong or missing). Leave
# blank to keep auto-discovery. Doesn't touch apps.yaml at all.
options:
  ev_charging_override: ""
  octopus_dispatch_override: ""
  import_rate_override: ""
  export_rate_override: ""
  octopus_saving_events_override: ""
  power_up_events_override: ""
  power_down_baseline_entity_override: ""
  power_up_baseline_entity_override: ""
  load_power_entity_override: ""
  ev_power_entity_override: ""
  grid_power_entity_override: ""
  battery_power_entity_override: ""
  ssen_postcode_override: ""
  storm_watch_entity_override: ""
  inverter_temp_entity_override: ""
  battery_temp_entity_override: ""
  daily_export_value_entity_override: ""
  battery_soh_entity_override: ""
  discharge_cutoff_entity_override: ""
schema:
  ev_charging_override: str?
  octopus_dispatch_override: str?
  import_rate_override: str?
  export_rate_override: str?
  octopus_saving_events_override: str?
  power_up_events_override: str?
  power_down_baseline_entity_override: str?
  power_up_baseline_entity_override: str?
  load_power_entity_override: str?
  ev_power_entity_override: str?
  grid_power_entity_override: str?
  battery_power_entity_override: str?
  ssen_postcode_override: str?
  storm_watch_entity_override: str?
  inverter_temp_entity_override: str?
  battery_temp_entity_override: str?
  daily_export_value_entity_override: str?
  battery_soh_entity_override: str?
  discharge_cutoff_entity_override: str?
